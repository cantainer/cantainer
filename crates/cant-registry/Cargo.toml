[package]
name = "cant-registry"
description = "OCI registry push and pull of cans for Cantainer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
cant-pack.workspace = true
cant-store.workspace = true
http = "1.3"
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "fs", "io-util"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
