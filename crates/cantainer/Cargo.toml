[package]
name = "cantainer"
description = "Run every executable as a least-privilege capsule. By default, you can't."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["sandbox", "landlock", "seccomp", "capabilities", "security"]
categories = ["command-line-utilities", "os::linux-apis"]

[lints]
workspace = true

[[bin]]
name = "cant"
path = "src/main.rs"

[dependencies]
cant-launch.workspace = true
cant-manifest.workspace = true
cant-policy.workspace = true
cant-store.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
