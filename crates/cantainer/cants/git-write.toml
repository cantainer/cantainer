# git-write: git with write access to .git, for you (not for an agent): commit, add, checkout.
# It can rewrite .git/config and .git/hooks, and those run later with your full rights, outside
# any cant. Use it on repositories you trust, and keep it out of agent-sh's `cants`.
# No network; can't read ~/.ssh or credential stores. `cant` refuses to start it from a
# directory that contains a protected path (such as your home directory).
manifest_version = 1
name = "git-write"
version = "0.1.0"
description = "Version control with write access to .git (hooks and config): for you, not for agents"

[entrypoint]
path = "git"

[args]
operands = "none"

[args.options]
"-m" = "value"
"--message" = "value"
"-F" = "r"
"--file" = "r"
"-c" = "value"
"-b" = "value"
"-B" = "value"

[capabilities]
network = false
fs.rw = ["$CWD"]
fs.ro = [
  "~/.gitconfig",
  "~/.config/git",
  "/etc/gitconfig",
  "/usr/share/git-core",
  "/usr/local/share/git-core",
  "/etc/passwd",
  "/etc/group",
  "/etc/nsswitch.conf",
]
# git runs helpers from its exec path (location differs between distributions and builds).
exec = ["git", "/usr/lib/git-core", "/usr/libexec/git-core", "/usr/local/libexec/git-core"]

[env]
pass = ["HOME", "LANG", "LC_*", "TERM", "GIT_AUTHOR_NAME", "GIT_AUTHOR_EMAIL", "GIT_COMMITTER_NAME", "GIT_COMMITTER_EMAIL", "GIT_PAGER", "PAGER", "EDITOR"]
