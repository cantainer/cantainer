# head: prints the start of the files named on its command line. Nothing else.
manifest_version = 1
name = "head"
version = "0.1.0"
description = "Print the first lines of files"

[entrypoint]
path = "head"

[args]
operands = "r"

[args.options]
"-n" = "value"
"--lines" = "value"
"-c" = "value"
"--bytes" = "value"

[env]
pass = ["LANG", "LC_*"]
