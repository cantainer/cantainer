# curl without network access: it fails before connecting. Use it where a tool must not reach
# the network; use curl-net when it should. It writes only files named with -o/--output.
manifest_version = 1
name = "curl"
version = "0.1.0"
description = "Transfer a URL (no network access)"

[entrypoint]
path = "curl"

[args]
operands = "none"

[args.options]
"-o" = "rw"
"--output" = "rw"
"-T" = "r"
"--upload-file" = "r"
"-d" = "value"
"--data" = "value"
"-H" = "value"
"--header" = "value"
"-X" = "value"
"--request" = "value"
"-A" = "value"
"--user-agent" = "value"
"-u" = "value"
"--user" = "value"
"-w" = "value"
"--write-out" = "value"
"-m" = "value"
"--max-time" = "value"

[capabilities]
network = false
fs.ro = ["/etc/ssl", "/usr/share/ca-certificates", "/etc/ca-certificates", "/etc/pki", "/etc/nsswitch.conf", "/etc/hosts", "/etc/resolv.conf", "/etc/host.conf", "/etc/gai.conf"]

[env]
pass = ["LANG", "LC_*", "TERM", "COLUMNS"]
