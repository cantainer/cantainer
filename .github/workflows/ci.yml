name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show   # installs the toolchain from rust-toolchain.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install programs used by the demo tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim curl jq tree ripgrep
      - run: cargo test --workspace --lib --bins
      - name: Doc tests and manifest validation
        run: cargo test --workspace --doc

  sandbox:
    # Integration tests against the runner's kernel. They skip (with a message) when the
    # kernel cannot sandbox, so this job reports Landlock support instead of failing on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install programs used by the demo tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim curl jq tree ripgrep
      - name: Kernel support
        run: |
          uname -r
          cat /sys/kernel/security/lsm || true
          cargo run --quiet -p cantainer -- check || echo "::warning::kernel cannot sandbox cants; sandbox tests will skip"
      - name: Local OCI registry for the push/pull tests
        run: dev/registry.sh install && dev/registry.sh start
      - name: Sandbox integration tests
        env:
          CANT_TEST_REGISTRY: 127.0.0.1:5000
        run: cargo test -p cantainer --test sandbox -- --nocapture

  cross:
    # Every target we support or ship must build warning-free: libc's syscall tables differ
    # between architectures and C libraries (0.0.2's first release run failed on aarch64-musl).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add ${{ matrix.target }}
      - name: C cross compilers (for ring)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm musl-tools \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
        env:
          # ring has C and assembly; aarch64 musl has no packaged cross compiler, so clang builds
          # it (only when cross-compiling; native arm64 uses musl-gcc). See dev/check.sh.
          CC_aarch64_unknown_linux_musl: clang
          AR_aarch64_unknown_linux_musl: llvm-ar

  arm64:
    # The static aarch64 build that releases ship, tested natively, sandbox tests included.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add aarch64-unknown-linux-musl
      - name: Install programs used by the demo tests, and musl-gcc (for ring)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim curl jq tree ripgrep musl-tools
      - run: cargo run --quiet --target aarch64-unknown-linux-musl -p cantainer -- check || true
      - run: dev/registry.sh install && dev/registry.sh start
      - run: cargo test --workspace --locked --target aarch64-unknown-linux-musl
        env:
          CANT_TEST_REGISTRY: 127.0.0.1:5000

  macos:
    # Linux-only code is cfg-gated; the workspace must still build on macOS for editing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo check --workspace --all-targets

  # ---- Cans across distributions -------------------------------------------------------------
  # A can carries its own libc and ELF loader: one packed on Ubuntu must run on Fedora, and the
  # reverse. Every job uses the same static `cant`, so only the cans differ. Containers run with
  # seccomp unconfined so that `cant` can install its own Landlock and seccomp filters.

  cans-cant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p cantainer
      - uses: actions/upload-artifact@v4
        with:
          name: cant-musl
          path: target/x86_64-unknown-linux-musl/release/cant

  cans-pack-ubuntu:
    needs: cans-cant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cant-musl, path: bin }
      - run: chmod +x bin/cant && CANT=$PWD/bin/cant dev/can-smoke.sh pack cans
      - uses: actions/upload-artifact@v4
        with: { name: cans-ubuntu, path: cans }

  cans-pack-fedora:
    needs: cans-cant
    runs-on: ubuntu-latest
    container:
      image: fedora:42
      options: --security-opt seccomp=unconfined
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cant-musl, path: bin }
      - run: chmod +x bin/cant && CANT=$PWD/bin/cant dev/can-smoke.sh pack cans
      - uses: actions/upload-artifact@v4
        with: { name: cans-fedora, path: cans }

  cans-run-on-fedora:
    needs: cans-pack-ubuntu
    runs-on: ubuntu-latest
    container:
      image: fedora:42
      options: --security-opt seccomp=unconfined
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cant-musl, path: bin }
      - uses: actions/download-artifact@v4
        with: { name: cans-ubuntu, path: cans }
      - run: chmod +x bin/cant && CANT=$PWD/bin/cant dev/can-smoke.sh run cans

  cans-run-on-ubuntu:
    needs: cans-pack-fedora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cant-musl, path: bin }
      - uses: actions/download-artifact@v4
        with: { name: cans-fedora, path: cans }
      - run: chmod +x bin/cant && CANT=$PWD/bin/cant dev/can-smoke.sh run cans
