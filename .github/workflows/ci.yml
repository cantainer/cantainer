name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show   # installs the toolchain from rust-toolchain.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install programs used by the demo tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim curl jq tree ripgrep
      - run: cargo test --workspace --lib --bins
      - name: Doc tests and manifest validation
        run: cargo test --workspace --doc

  sandbox:
    # Integration tests against the runner's kernel. They skip (with a message) when the
    # kernel cannot sandbox, so this job reports Landlock support instead of failing on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install programs used by the demo tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim curl jq tree ripgrep
      - name: Kernel support
        run: |
          uname -r
          cat /sys/kernel/security/lsm || true
          cargo run --quiet -p cantainer -- check || echo "::warning::kernel cannot sandbox cants; sandbox tests will skip"
      - name: Sandbox integration tests
        run: cargo test -p cantainer --test sandbox -- --nocapture

  cross:
    # Every target we support or ship must build warning-free: libc's syscall tables differ
    # between architectures and C libraries (0.0.2's first release run failed on aarch64-musl).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings

  arm64:
    # The static aarch64 build that releases ship, tested natively, sandbox tests included.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add aarch64-unknown-linux-musl
      - name: Install programs used by the demo tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim curl jq tree ripgrep
      - run: cargo run --quiet --target aarch64-unknown-linux-musl -p cantainer -- check || true
      - run: cargo test --workspace --locked --target aarch64-unknown-linux-musl

  macos:
    # Linux-only code is cfg-gated; the workspace must still build on macOS for editing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo check --workspace --all-targets
