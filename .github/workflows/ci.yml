name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show   # installs the toolchain from rust-toolchain.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install programs used by the demo tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim curl jq tree ripgrep
      - run: cargo test --workspace --lib --bins
      - name: Doc tests and manifest validation
        run: cargo test --workspace --doc

  sandbox:
    # Integration tests against the runner's kernel. They skip (with a message) when the
    # kernel cannot sandbox, so this job reports Landlock support instead of failing on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install programs used by the demo tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends vim curl jq tree ripgrep
      - name: Kernel support
        run: |
          uname -r
          cat /sys/kernel/security/lsm || true
          cargo run --quiet -p cantainer -- check || echo "::warning::kernel cannot sandbox cants; sandbox tests will skip"
      - name: Sandbox integration tests
        run: cargo test -p cantainer --test sandbox -- --nocapture

  macos:
    # Linux-only code is cfg-gated; the workspace must still build on macOS for editing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo check --workspace --all-targets
