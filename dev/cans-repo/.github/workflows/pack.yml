name: pack

# Packs cans with `cant pack` from the built-in cants and pushes them to
# ghcr.io/cantainer/<name>:<program version>.
#
# Runs by hand (Actions > pack > Run workflow). The packages stay PRIVATE until the cans are
# signed (Sigstore, added to this workflow, so the signer identity of every can is this
# workflow) and the sources of the GPL/LGPL programs inside are published with them
# (cantainer docs/CANS.md section 8).

on:
  workflow_dispatch:
    inputs:
      cantainer_ref:
        description: cantainer commit, branch or tag to build `cant` from
        default: main

permissions:
  contents: read
  packages: write

jobs:
  pack:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        can: [grep, git]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cantainer/cantainer
          ref: ${{ inputs.cantainer_ref }}
          path: cantainer
          persist-credentials: false
      - name: Build cant
        working-directory: cantainer
        run: |
          rustup show
          cargo build --release --locked -p cantainer
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Pack
        id: pack
        run: |
          case "${{ matrix.can }}" in
            grep) version=$(grep --version | head -n1 | awk '{print $NF}') ;;
            git)  version=$(git --version | awk '{print $3}') ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cant pack "${{ matrix.can }}" -o "${{ matrix.can }}.can"
      - name: Push
        env:
          CANT_REGISTRY_USER: ${{ github.actor }}
          CANT_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cant push "${{ matrix.can }}.can" "ghcr.io/cantainer/${{ matrix.can }}:${{ steps.pack.outputs.version }}"
      - name: Pull and run it back, from an empty store
        env:
          # The packages are private until the cans are signed and their sources published.
          CANT_REGISTRY_USER: ${{ github.actor }}
          CANT_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export XDG_DATA_HOME=$(mktemp -d)
          ref="ghcr.io/cantainer/${{ matrix.can }}:${{ steps.pack.outputs.version }}"
          cant pull "$ref"
          cd "$(mktemp -d)"
          case "${{ matrix.can }}" in
            grep) echo hello > notes.txt && cant run "$ref" hello notes.txt ;;
            git)  cant run "$ref" --version ;;
          esac
