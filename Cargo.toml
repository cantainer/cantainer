[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cantainer/cantainer"
homepage = "https://github.com/cantainer/cantainer"
authors = ["Arie Radle"]

[workspace.dependencies]
cant-manifest = { path = "crates/cant-manifest", version = "=0.0.3" }
cant-policy = { path = "crates/cant-policy", version = "=0.0.3" }
cant-launch = { path = "crates/cant-launch", version = "=0.0.3" }
cant-store = { path = "crates/cant-store", version = "=0.0.3" }

libc = "0.2.191"
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
landlock = "0.4.7"
proptest = "1.12.0"
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
